<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formula 1 race results, championship standings, telemetry and machine-learned race predictions.">
    <meta name="theme-color" content="#05060a">
    <title>{% block title %}F1 Analytics Hub{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <noscript>
        <style>
            [data-reveal] { opacity: 1; transform: none; }
            .bar__fill, .conf-bar__fill { width: 100%; }
        </style>
    </noscript>
</head>
<body>
    <div class="scroll-progress" aria-hidden="true"></div>

    <div class="ambient" aria-hidden="true">
        <div class="ambient__grid"></div>
        <div class="ambient__orb ambient__orb--red"></div>
        <div class="ambient__orb ambient__orb--cyan"></div>
        <div class="ambient__orb ambient__orb--violet"></div>
        <div class="ambient__streaks">
            <span class="ambient__streak"></span>
            <span class="ambient__streak"></span>
            <span class="ambient__streak"></span>
            <span class="ambient__streak"></span>
        </div>
        <div class="ambient__noise"></div>
    </div>

    <aside class="rail">
        <a href="/" class="brand">
            <span class="brand__mark">F1</span>
            <span class="brand__text">
                <span class="brand__title">Analytics Hub</span>
                <span class="brand__sub">Race Intelligence</span>
            </span>
        </a>

        <nav class="nav">
            <span class="nav__label">Explore</span>
            <a href="/" class="nav__link {% block nav_results %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20V10M18 20V4M6 20v-4"/>
                </svg>
                Race Results
            </a>
            <a href="/standings/drivers" class="nav__link {% block nav_drivers %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6"/>
                </svg>
                Driver Standings
            </a>
            <a href="/standings/constructors" class="nav__link {% block nav_constructors %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18M15 3v18"/>
                </svg>
                Constructors
            </a>
            <a href="/telemetry" class="nav__link {% block nav_telemetry %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                </svg>
                Telemetry
            </a>
            <a href="/schedule" class="nav__link {% block nav_schedule %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <path d="M3 10h18M16 2v4M8 2v4"/>
                </svg>
                Schedule
            </a>
            <a href="/predictions" class="nav__link {% block nav_predictions %}{% endblock %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                    <path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
                Race Predictions
            </a>
        </nav>

        <button class="rail-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
        </button>

        <div class="rail__footer">
            <p style="margin:0 0 6px">Data from <a href="https://github.com/theOehrly/Fast-F1" target="_blank" rel="noopener">FastF1</a> and the Ergast archive.</p>
            <p style="margin:0">Predictions are a model's opinion, not betting advice.</p>
        </div>
    </aside>

    <main class="shell">
        <div class="wrap">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script src="/static/js/script.js?v=3"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
